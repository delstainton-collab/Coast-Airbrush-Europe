<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coast Airbrush Europe — Workshop BOM & Manufacturing Console</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --card: #18181c;
      --border: #27272a;
      --border-focus: #3f3f46;
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.25);
      --green: #10b981;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-flame {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .badge-mfg {
      background: rgba(239,68,68,0.15);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 10px;
    }
    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .product-card:hover {
      border-color: var(--border-focus);
    }
    .prod-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .prod-brand {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .prod-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 4px;
      line-height: 1.3;
    }
    .prod-sku {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .stock-pills {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }
    .stock-pill {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stock-pill .val {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
    }
    .stock-pill.shelf .val { color: var(--blue); }
    .stock-pill.atb .val { color: var(--green); }
    .stock-pill .lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
    }

    .bottleneck-box {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .bottleneck-box strong { color: var(--amber); }

    .cogs-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
      padding-top: 12px;
      border-top: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .cogs-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text);
    }
    .margin-tag {
      color: var(--green);
      font-weight: 700;
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: var(--border);
    }
    .btn-primary {
      background: var(--red);
      color: #fff;
    }
    .btn-primary:hover {
      background: #dc2626;
      box-shadow: 0 0 12px var(--red-glow);
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .parts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      margin-top: 12px;
    }
    .parts-table th, .parts-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .parts-table th {
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-title">
      <div class="brand-flame">⚙️</div>
      <div>Coast Airbrush Europe — Workshop BOM & Assembly Console</div>
    </div>
    <div class="badge-mfg">Live Manufacturing System</div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Manufactured Kits & Jigs</div>
      <div class="stat-value" id="stat-kits">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Components & Hardware</div>
      <div class="stat-value" id="stat-components">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Packaging / Parts Alerts</div>
      <div class="stat-value" id="stat-alerts" style="color: var(--amber);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Average Gross Margin</div>
      <div class="stat-value" id="stat-margin" style="color: var(--green);">0%</div>
    </div>
  </div>

  <div class="section-title">
    <span>Products & Available-To-Build (ATB) Matrix</span>
    <button class="btn btn-secondary" onclick="loadDashboard()">🔄 Refresh</button>
  </div>

  <div class="products-grid" id="products-grid">
    <!-- Populated dynamically -->
  </div>

  <!-- Explode BOM Modal -->
  <div class="modal-overlay" id="bom-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="bom-modal-title">Exploded Bill of Materials</h3>
        <button class="modal-close" onclick="closeModal('bom-modal')">&times;</button>
      </div>
      <div id="bom-modal-body"></div>
    </div>
  </div>

  <!-- Assemble Batch Modal -->
  <div class="modal-overlay" id="assemble-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="assemble-modal-title">Execute Assembly Work Order</h3>
        <button class="modal-close" onclick="closeModal('assemble-modal')">&times;</button>
      </div>
      <form id="assemble-form" onsubmit="handleAssembleSubmit(event)">
        <input type="hidden" id="assemble-sku" name="parentSku">
        <div class="form-group">
          <label class="form-label">Quantity to Assemble</label>
          <input type="number" id="assemble-qty" name="quantity" class="form-input" min="1" required>
          <small id="assemble-max-helper" style="color: var(--text-muted); font-size: 0.75rem; margin-top: 4px; display: block;"></small>
        </div>
        <div class="form-group">
          <label class="form-label">Technician / Bench</label>
          <input type="text" id="assemble-tech" name="technician" class="form-input" value="Workshop Bench 1" required>
        </div>
        <div class="form-group">
          <label class="form-label">Production Batch Notes</label>
          <input type="text" id="assemble-notes" name="notes" class="form-input" value="Standard workshop assembly batch">
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="assemble-sync" name="syncShopify" checked>
          <label for="assemble-sync" style="font-size: 0.85rem;">Automatically update Shopify sellable inventory count</label>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          ⚡ Confirm Build & Deduct Raw Stock
        </button>
      </form>
    </div>
  </div>

  <script>
    let globalRecipes = [];

    async function safeBomFetch(endpoint, options) {
      // 1. Try relative URL (current origin)
      try {
        const res = await fetch(endpoint, options);
        if (res.ok) return await res.json();
      } catch (e) {}

      // 2. Try standalone BOM server on :3016
      try {
        const res = await fetch('http://localhost:3016' + endpoint, options);
        if (res.ok) return await res.json();
      } catch (e) {}

      // 3. Try main CAE server on :3013
      try {
        const res = await fetch('http://localhost:3013' + endpoint, options);
        if (res.ok) return await res.json();
      } catch (e) {}

      throw new Error(`Could not connect to BOM API on current host, localhost:3016, or localhost:3013.`);
    }

    async function loadDashboard() {
      try {
        const data = await safeBomFetch('/api/bom/summary');
        if (!data.success) throw new Error(data.error);

        globalRecipes = data.recipes;
        document.getElementById('stat-kits').innerText = data.recipes.length;
        document.getElementById('stat-alerts').innerText = data.reorderAlerts.length;

        // Calculate average margin
        const totalMargin = data.recipes.reduce((acc, r) => acc + (r.cogsSummary?.grossMarginPct || 0), 0);
        const avgMargin = (totalMargin / data.recipes.length).toFixed(1);
        document.getElementById('stat-margin').innerText = avgMargin + '%';

        const compData = await safeBomFetch('/api/bom/components');
        document.getElementById('stat-components').innerText = compData.count || 0;

        renderProducts(data.recipes);
      } catch (err) {
        console.error('Failed to load dashboard:', err);
        const container = document.getElementById('products-grid');
        if (container) {
          container.innerHTML = `
            <div style="grid-column: 1/-1; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--red); padding: 24px; border-radius: 8px;">
              <h3 style="color: var(--red); margin-bottom: 8px;">⚠️ BOM Engine Server Offline or Stale</h3>
              <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 12px;">
                The workshop console could not connect to <code>/api/bom/summary</code>. If the main server on port 3013 was running prior to this module being created, please restart it or start the standalone BOM server:
              </p>
              <pre style="background: #000; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #fff; margin-bottom: 12px;">npm run bom:dev</pre>
              <p style="color: var(--text-muted); font-size: 0.85rem;">Then refresh this page or browse to: <a href="http://localhost:3016" style="color: var(--blue);">http://localhost:3016</a></p>
            </div>
          `;
        }
      }
    }

    function renderProducts(recipes) {
      const container = document.getElementById('products-grid');
      container.innerHTML = recipes.map(r => {
        const b = r.bottleneck;
        const cogs = r.cogsSummary;
        return `
          <div class="product-card">
            <div>
              <div class="prod-header">
                <div>
                  <div class="prod-brand">${r.brand}</div>
                  <div class="prod-title">${r.title}</div>
                  <div class="prod-sku">SKU: ${r.parentSku}</div>
                </div>
              </div>

              <div class="stock-pills">
                <div class="stock-pill shelf">
                  <div class="val">${r.finishedStockQty}</div>
                  <div class="lbl">Finished on Shelf</div>
                </div>
                <div class="stock-pill atb">
                  <div class="val">${r.availableToBuild}</div>
                  <div class="lbl">Available To Build</div>
                </div>
              </div>

              ${b ? `
                <div class="bottleneck-box">
                  <strong>⚠️ Limiting Bottleneck:</strong><br>
                  ${b.name} (${b.sku})<br>
                  Stock: ${b.currentStock} in inventory (${b.leadTimeDays}d lead time from ${b.supplier})
                </div>
              ` : ''}

              <div class="cogs-row">
                <div>Retail: <span class="cogs-val">£${cogs.retailPriceGbp}</span></div>
                <div>Landed COGS: <span class="cogs-val">£${cogs.totalCogsGbp}</span></div>
                <div class="margin-tag">${cogs.grossMarginPct}% Margin</div>
              </div>
            </div>

            <div class="card-actions">
              <button class="btn btn-secondary" onclick="openBomModal('${r.parentSku}')">
                🔍 Explode BOM
              </button>
              <button class="btn btn-primary" onclick="openAssembleModal('${r.parentSku}')">
                ⚙️ Assemble
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function openBomModal(sku) {
      try {
        const data = await safeBomFetch(`/api/bom/atb/${sku}`);
        if (!data.success) return alert(data.error);

        const atb = data.atb;
        document.getElementById('bom-modal-title').innerText = `${atb.title} [${atb.parentSku}]`;
        
        let html = `
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">
            Finished Stock: <strong>${atb.currentFinishedStock}</strong> | 
            Buildable Right Now: <strong style="color: var(--green);">${atb.availableToBuild}</strong> |
            Total Potential: <strong>${atb.totalPotentialStock}</strong>
          </p>
          <table class="parts-table">
            <thead>
              <tr>
                <th>Component SKU</th>
                <th>Part Name</th>
                <th>Qty/Unit</th>
                <th>On Hand</th>
                <th>Max Buildable</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${atb.componentBreakdown.map(c => `
                <tr style="${c.isBottleneck ? 'background: rgba(245, 158, 11, 0.1); font-weight: 600;' : ''}">
                  <td style="font-family: monospace;">${c.sku}</td>
                  <td>${c.name}</td>
                  <td>${c.requiredQty}</td>
                  <td>${c.currentStock}</td>
                  <td>${c.maxPossible}</td>
                  <td>${c.isBottleneck ? '<span style="color: var(--amber);">⚠️ BOTTLENECK</span>' : '<span style="color: var(--green);">OK</span>'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        document.getElementById('bom-modal-body').innerHTML = html;
        document.getElementById('bom-modal').classList.add('active');
      } catch (err) {
        alert('❌ Error loading BOM details: ' + err.message);
      }
    }

    function openAssembleModal(sku) {
      const recipe = globalRecipes.find(r => r.parentSku === sku);
      if (!recipe) return;

      document.getElementById('assemble-sku').value = sku;
      document.getElementById('assemble-modal-title').innerText = `Assemble: ${recipe.title}`;
      document.getElementById('assemble-qty').value = Math.min(recipe.availableToBuild, 5);
      document.getElementById('assemble-qty').max = recipe.availableToBuild;
      document.getElementById('assemble-max-helper').innerText = `Maximum buildable right now based on components: ${recipe.availableToBuild} units`;
      document.getElementById('assemble-modal').classList.add('active');
    }

    async function handleAssembleSubmit(e) {
      e.preventDefault();
      const parentSku = document.getElementById('assemble-sku').value;
      const quantity = parseInt(document.getElementById('assemble-qty').value, 10);
      const technician = document.getElementById('assemble-tech').value;
      const notes = document.getElementById('assemble-notes').value;
      const syncShopify = document.getElementById('assemble-sync').checked;

      try {
        const data = await safeBomFetch('/api/bom/assemble', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ parentSku, quantity, technician, notes, syncShopify })
        });
        if (!data.success) throw new Error(data.error);

        alert(`✅ Assembly Order Successful!\nWork Order: ${data.workOrder.workOrderId}\nNew Finished Stock: ${data.workOrder.newFinishedStock}`);
        closeModal('assemble-modal');
        loadDashboard();
      } catch (err) {
        alert('❌ Assembly Error: ' + err.message);
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    window.onload = loadDashboard;
  </script>
</body>
</html>
